<div class="modal-header border-0 bg-light">
  <h5 class="modal-title d-flex align-items-center" id="exampleModalLabel">
    <i class="fas fa-tools text-primary me-2"></i>
    Remediation Strategy: {{ entry?.cveId }}
  </h5>
  <button type="button" class="btn-close" (click)="modalRef.close()"></button>
</div>

<div class="modal-body p-4">
  <div class="alert alert-warning d-flex align-items-center border-0 shadow-none mb-4">
    <i class="fas fa-calendar-exclamation me-3 fs-4"></i>
    <div>
      <div class="small fw-bold text-uppercase">CISA Federal Action Deadline</div>
      <div class="h5 mb-0">{{ entry?.dueDate | date:'longDate' }}</div>
    </div>
  </div>

  <h6 class="fw-bold text-muted text-uppercase small mb-2">Vulnerability Overview</h6>
  <p class="mb-4 text-dark">{{ entry?.description }}</p>

  <h6 class="fw-bold text-muted text-uppercase small mb-2">Required Action</h6>
  <div class="p-3 bg-light rounded border-start border-4 border-primary mb-4">
    <p class="mb-0 fw-medium">{{ entry?.requiredActions }}</p>
  </div>

  <div *ngIf="entry?.notes" class="mt-3">
    <h6 class="fw-bold text-muted text-uppercase small mb-2">Analyst Notes</h6>
    <p class="small text-muted italic">"{{ entry?.notes }}"</p>
  </div>
</div>

<div class="modal-footer border-0">
  <button type="button" class="btn btn-light shadow-0" (click)="modalRef.close()">Close</button>
  <button type="button" class="btn btn-primary shadow-0" (click)="copyActions()">
    <i class="fas fa-copy me-2"></i>Copy Actions
  </button>
</div>
