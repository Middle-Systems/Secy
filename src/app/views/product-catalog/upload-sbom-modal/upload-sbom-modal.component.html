<div class="modal-header">
  <h5 class="modal-title">Upload New SBOM</h5>
  <button type="button" class="btn-close" (click)="modalRef.close()"></button>
</div>
<div class="modal-body">
  <div class="mb-4">
    <label class="form-label fw-bold small text-uppercase">Product Release Version</label>
    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-tag"></i></span>
      <input
        type="text"
        [(ngModel)]="productVersion"
        class="form-control"
        placeholder="e.g. v2.4.0-release or 2026.Q1.1"
      />
    </div>
    <div class="form-helper text-muted" style="font-size: 0.7rem;">
      This label will be used to identify this scan in the history catalog.
    </div>
  </div>

  <div class="file-drop-zone p-5 border border-2 border-dashed rounded text-center">
    <input type="file" (change)="onFileSelected($event)" id="fileInput" hidden />
    <label for="fileInput" class="cursor-pointer">
      <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
      <p class="mb-0">Click to select or drag and drop your SBOM (JSON)</p>
      <small class="text-muted" *ngIf="selectedFile">{{selectedFile.name}}</small>
    </label>
  </div>
</div>
<div class="modal-footer">
  <button class="btn btn-secy-secondary" (click)="modalRef.close()">CANCEL</button>
  <button
    class="btn btn-secy-primary"
    [disabled]="!selectedFile || !productVersion"
    (click)="upload()">
    START ANALYSIS
  </button>
</div>
