# Served by nginx:1.27-alpine (see ../Dockerfile). Two jobs:
#   1. Serve the built SPA with a history-mode fallback so a hard refresh on a
#      TanStack Router deep path (e.g. /actionable/123) doesn't 404.
#   2. Reverse-proxy /api/** to the `api` compose service, mirroring the dev-server
#      proxy in ui/vite.config.ts (which rewrites `^/api` away before forwarding) —
#      so proxy_pass below does NOT repeat `/api` in its target path.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry document — it references the current content-hashed
    # asset filenames, and a stale cached copy would point at deleted chunks.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite's build output hashes every asset filename (index-<hash>.js etc.), so it's
    # safe to cache these aggressively and immutably — a changed file gets a new name.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to the API service. Trailing slash on both `location` and
    # `proxy_pass` strips the `/api` prefix before forwarding, e.g.
    # `/api/actionable` -> `http://api:8080/actionable` — same rewrite the Vite dev
    # proxy does with `rewrite: (p) => p.replace(/^\/api/, '')`.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any path that isn't a real static file (client-side routes,
    # deep-linked/refreshed URLs) resolves to index.html so TanStack Router's
    # code-based routing can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
