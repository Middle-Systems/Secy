services:
  postgres:
    image: 'postgres:16'
    container_name: secy-postgres
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=secy'
      - 'POSTGRES_PASSWORD=${SECY_DB_PASSWORD:-secy}'
      - 'POSTGRES_USER=secy'
    ports:
      - '5433:5432'
    volumes:
      # Named volume so ingested feed data survives `docker compose down`.
      - 'secy-pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U secy -d secy']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  secy-pgdata:
