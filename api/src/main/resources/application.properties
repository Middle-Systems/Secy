spring.application.name=secy
logging.level.net.jdesive=DEBUG

spring.datasource.url=${SECY_DB_URL:jdbc:postgresql://localhost:5433/secy}
spring.datasource.username=${SECY_DB_USERNAME:secy}
spring.datasource.password=${SECY_DB_PASSWORD:secy}
# Liquibase owns the schema; Hibernate only checks the entity model against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Do NOT auto-run `docker compose up` on start. Point SECY_DB_URL at a PostgreSQL you
# manage (a native install, a hosted DB, or `docker compose -f api/compose.yaml up -d`
# on a machine that has Docker). Set spring.docker.compose.enabled=true in
# application-local.properties to opt back into the automatic container.
spring.docker.compose.enabled=false

# OpenAPI / Swagger UI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Ingestion jobs ---
# Feed ingests run as background jobs: POST /{feed}/ingest enqueues, a poller claims the row and
# runs it on the pool below, the client polls GET /jobs/{id}. Feeds: NVD (/nvd/ingest), EPSS
# (/epss/ingest), KEV (/kev/ingest) and the merged exploit index (/exploits/ingest — Nuclei
# templates + Metasploit modules + PoC-in-GitHub, no API key).
secy.jobs.worker-pool-size=2
secy.jobs.stale-timeout=PT30M
secy.jobs.poll-interval=PT10S
# Set false to leave enqueued jobs untouched (the test profile does; see JobScheduler).
secy.jobs.scheduler-enabled=true

# --- Actionable funnel ---
# An alert is promoted to actionable when its CVE is KEV-listed, or its EPSS probability is
# STRICTLY above this value. Raise it to cut noise, lower it to widen the net.
secy.actionable.epss-threshold=${SECY_ACTIONABLE_EPSS_THRESHOLD:0.1}

# --- OSV mirror ---
# Per-ecosystem GCS export (osv-vulnerabilities.storage.googleapis.com/<ecosystem>/all.zip) mirrored
# into osv_advisory / osv_affected_range / osv_ecosystem_cursor via POST /osv/ingest. Comma-separated
# list of OSV ecosystem names.
secy.osv.ecosystems=${SECY_OSV_ECOSYSTEMS:npm,Maven,PyPI,Go,NuGet,RubyGems,crates.io,Packagist,Hex,Pub}

# --- CVE List v5 / Vulnrichment ---
# Bulk snapshot of CVE JSON Schema 5.1 records (CVEProject/cvelistV5), including the CISA-ADP
# Vulnrichment container, applied onto existing vulnerabilities rows via POST /cve-list/ingest.
# The exact release-asset filename isn't hardcoded — the releases API is queried and the first
# .zip asset on the latest release is used.
secy.cve-list.releases-api-url=${SECY_CVE_LIST_RELEASES_API_URL:https://api.github.com/repos/CVEProject/cvelistV5/releases/latest}

# --- Auth ---
secy.auth.jwt.secret=${SECY_AUTH_JWT_SECRET:}
secy.auth.jwt.ttl=PT24H
secy.auth.registration-enabled=${SECY_AUTH_REGISTRATION_ENABLED:true}

# Request a key at https://nvd.nist.gov/developers/request-an-api-key
nvd.apikey=${NVD_API_KEY:}

# --- Source connectors (Phase 6b) ---
# One token for the whole Secy instance, not per-connector -- see SourceConnector's class Javadoc.
# A GitHub PAT with `repo` + `read:org` scope. POST /connectors/{id}/sync reads it at sync time;
# blank means every sync will 401/403 per-repo (each repo is skipped and counted, not a crash).
secy.github.token=${SECY_GITHUB_TOKEN:}

# Untracked local overrides: src/main/resources/application-local.properties
spring.config.import=optional:classpath:application-local.properties
