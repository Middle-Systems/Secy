spring.application.name=secy
logging.level.net.jdesive=DEBUG

spring.datasource.url=${SECY_DB_URL:jdbc:postgresql://localhost:5433/secy}
spring.datasource.username=${SECY_DB_USERNAME:secy}
spring.datasource.password=${SECY_DB_PASSWORD:secy}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Request a key at https://nvd.nist.gov/developers/request-an-api-key
nvd.apikey=${NVD_API_KEY:}

# Untracked local overrides: src/main/resources/application-local.properties
spring.config.import=optional:classpath:application-local.properties
