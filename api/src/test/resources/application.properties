spring.application.name=secy-test

# In-memory H2 in PostgreSQL compatibility mode — the test suite must run fully offline.
spring.datasource.url=jdbc:h2:mem:secy;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests run against the Hibernate-built schema. The Liquibase changelog is
# PostgreSQL-dialect and is validated against a real PostgreSQL separately
# (see src/main/resources/db/changelog/README.md).
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false

# No docker in CI/devcontainer.
spring.docker.compose.enabled=false

# Override the main profile's optional local-overrides import so a developer's
# application-local.properties can never leak into a test run.
spring.config.import=

nvd.apikey=test

# Source connectors (Phase 6b). GitHubSyncService/GitHubApiClient tests stub the transport with
# MockRestServiceServer, so this only needs to be present and stable, never reachable.
secy.github.token=test-github-token

# Every @SpringBootTest context in this suite shares one in-memory H2 database, so a live queue
# poller in a cached context would claim and run jobs another test class had just enqueued. Tests
# drive JobRunner/JobService directly instead. (The main properties file is REPLACED by this one,
# not merged, so the secy.jobs.* defaults from IngestionJobProperties apply to everything else.)
secy.jobs.scheduler-enabled=false

# Funnel threshold. Restated here because this file REPLACES the main one rather than merging
# with it, and the funnel tests assert on the exact boundary.
secy.actionable.epss-threshold=0.1

# OSV mirror. Restated here for the same reason; individual ingest tests narrow this further via
# @TestPropertySource to keep zip fixtures small.
secy.osv.ecosystems=npm,Maven,PyPI,Go,NuGet,RubyGems,crates.io,Packagist,Hex,Pub

# Supply-chain compromise detection. Restated here for the same reason -- this file REPLACES the main
# one. Both feed URLs are stubbed at the transport by MockRestServiceServer in the ingest tests, so
# the values only have to be stable and recognisable, never reachable. The aging window is restated
# because the aging-transition test asserts on the exact boundary.
secy.compromise.malicious-packages-url=https://codeload.github.com/ossf/malicious-packages/zip/refs/heads/main
secy.compromise.ecosystems=npm,pypi,maven,go,nuget,packagist,rubygems,crates.io
secy.compromise.malware-bazaar-url=https://bazaar.abuse.ch/export/csv/recent/
secy.compromise.malware-bazaar-api-key=
secy.compromise.ioc-stale-after=P90D
secy.compromise.aging-enabled=true

logging.level.root=WARN
logging.level.net.jdesive=WARN
logging.level.org.hibernate.SQL=WARN

# Fixed signing key so tokens are reproducible across a test run. Not a secret —
# it never leaves this file and is not valid anywhere. (The main properties file is
# REPLACED by this one, not merged, so secy.auth.* has to be restated here.)
secy.auth.jwt.secret=test-secret-at-least-256-bits-long-0000000000000000
secy.auth.registration-enabled=true
