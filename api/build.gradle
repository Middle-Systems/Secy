plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.cyclonedx.bom' version '1.10.0'
}

group = 'net.jdesive'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.github.package-url:packageurl-java:1.5.0'
	// Maven's own version ordering (ComparableVersion), used by correlation.version.MavenScheme.
	// Maven version precedence is defined by this implementation, not by a spec anyone can
	// reimplement safely — a hand-rolled comparator here would be the highest-risk guess in the
	// correlation engine. `transitive = false` keeps it to one 58 KB jar: ComparableVersion and its
	// inner Item classes reference nothing outside java.*, verified against the class file.
	implementation('org.apache.maven:maven-artifact:3.9.9') { transitive = false }
	// AWS connector (Phase 6b): EC2/ECR/Lambda enumeration + Inspector v2 findings. AWS's SigV4
	// request signing is genuinely unsafe to hand-roll (unlike GitHub's/Azure's plain bearer-token
	// auth, which is just an HTTP header) -- this is the one deliberate exception to "plain REST +
	// the shared RestTemplate" every other integration in this codebase uses. Scoped to the four
	// service modules actually needed, not the full SDK bundle; versions come from the BOM below.
	implementation platform('software.amazon.awssdk:bom:2.28.11')
	implementation 'software.amazon.awssdk:ec2'
	implementation 'software.amazon.awssdk:ecr'
	implementation 'software.amazon.awssdk:lambda'
	implementation 'software.amazon.awssdk:inspector2'
	// Azure connector (Phase 6b) needs no SDK: Azure Resource Manager and Defender for Cloud are
	// both plain OAuth2-bearer-token REST APIs, so AzureSyncService authenticates with a
	// client-credentials token fetch through the shared RestTemplate, matching every other
	// integration's style. See AzureSyncService.
	// JWT — api on the compile classpath, impl/jackson resolved at runtime only.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
	// Emits META-INF/build-info.properties so a BuildProperties bean is available at
	// runtime — OpenApiConfig reads the project version from it.
	buildInfo()
}

tasks.named('test') {
	useJUnitPlatform()
}
